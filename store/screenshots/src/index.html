<!DOCTYPE html>
<html>
<head>

<title>Tuijo — store screenshots</title>

<style>
/* =========================================================
   Palette e tipografia: identiche a public/styles.css (sito)
   ========================================================= */
:root {
  --teal: #2F9DA6; --teal-bright: #3BA8B0; --teal-deep: #145A60; --teal-ink: #0C2E32; --teal-night: #08252A;
  --cherry: #D81F2C; --cherry-deep: #9E1B22; --cherry-soft: #F0858E; --leaf: #7CA01E;
  --paper: #F4EDE0; --paper-2: #EFE6D6; --paper-card: #FBF7EF; --cream-line: #E3D7C2;
  --ink: #16302F; --ink-soft: #4A5E5C; --ink-faint: #7E8E8B;
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --sans: "Hanken Grotesk", system-ui, sans-serif;
  --app-font: "Inter", "Roboto", system-ui, sans-serif;
  --grad: linear-gradient(135deg, #3BA8B0, #145A60);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: var(--sans); -webkit-font-smoothing: antialiased; color: var(--ink); }
img { display: block; }

/* ---------- Pagina (uno screenshot) ---------- */
.shot { position: relative; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: var(--paper); }
.shot.dark { background: linear-gradient(160deg, var(--teal-deep) 0%, var(--teal-ink) 55%, var(--teal-night) 100%); color: #fff; }
.bg-cherry { position: absolute; z-index: 0; width: 46vw; right: -16vw; top: -3vh; opacity: .07; transform: rotate(-16deg); pointer-events: none; filter: saturate(.9); }
.shot.dark .bg-cherry { opacity: .07; }
.glow { position: absolute; z-index: 0; left: 50%; top: 66%; width: 130vw; height: 76vh; transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(47,157,166,.34), transparent 72%); }
.shot.dark .glow { background: radial-gradient(closest-side, rgba(59,168,176,.40), transparent 72%); }

.copy { position: relative; z-index: 2; text-align: center; padding: 6.2vh 6.5vw 0; }
.eyebrow { display: inline-flex; align-items: center; gap: .7em; font-weight: 600; font-size: 3vw; letter-spacing: .18em; text-transform: uppercase; color: var(--teal-deep); }
.eyebrow::before, .eyebrow::after { content: ""; width: 1.6em; height: 1.5px; background: var(--cherry); }
.shot.dark .eyebrow { color: var(--teal-bright); }
h1 { font-family: var(--display); font-weight: 800; font-size: 9.4vw; line-height: 1.02; letter-spacing: -.02em; color: var(--teal-ink); margin-top: 1.4vh; text-wrap: balance; }
.shot.dark h1 { color: #fff; }
.serif-em { font-family: var(--serif); font-weight: 400; font-style: italic; letter-spacing: 0; }
.shot.dark .serif-em { color: var(--cherry-soft); }
.sub { font-size: 4.2vw; line-height: 1.35; color: var(--ink-soft); margin: 1.6vh auto 0; max-width: 30ch; text-wrap: balance; }
.shot.dark .sub { color: rgba(255,255,255,.78); }

/* android 9:16: meno alto, quindi testi e telefono un po' più compatti */
.dev-android .copy { padding-top: 5vh; }
.dev-android h1 { font-size: 8.6vw; }
.dev-android .sub { font-size: 3.9vw; margin-top: 1.2vh; }
.dev-android .stage { padding-top: 3vh; }
.dev-android .device.android { width: 74vw; }

/* tablet: testi proporzionalmente più piccoli */
.dev-ipad .eyebrow, .dev-tablet .eyebrow { font-size: 1.9vw; }
.dev-ipad h1, .dev-tablet h1 { font-size: 6.4vw; }
.dev-ipad .sub, .dev-tablet .sub { font-size: 2.6vw; max-width: 36ch; }
.dev-ipad .copy, .dev-tablet .copy { padding-top: 5.5vh; }

.stage { position: relative; z-index: 2; flex: 1; display: flex; justify-content: center; align-items: flex-start; padding-top: 4vh; }

/* ---------- Cornici dispositivo ---------- */
.device { position: relative; background: #0c0f12; box-shadow: 0 40px 90px -30px rgba(12,46,50,.55), 0 0 0 2px rgba(255,255,255,.07) inset; }
.shot.dark .device { box-shadow: 0 40px 90px -30px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.12) inset; }
.device::after { content: ""; position: absolute; right: -0.8vw; top: 22%; width: .8vw; height: 9%; background: #0c0f12; border-radius: 0 3px 3px 0; }
.screen { position: relative; width: 100%; overflow: hidden; background: #fff; }
.device.iphone { width: 80vw; border-radius: 13vw; padding: 3vw; }
.device.iphone .screen { aspect-ratio: 1320 / 2868; border-radius: 10vw; }
.device.android { width: 80vw; border-radius: 9vw; padding: 2.2vw; }
.device.android .screen { aspect-ratio: 1080 / 2340; border-radius: 6.8vw; }
.device.ipad { width: 78vw; border-radius: 4.6vw; padding: 3.4vw; }
.device.ipad .screen { aspect-ratio: 2064 / 2752; border-radius: 1.6vw; }
.device.tablet { width: 78vw; border-radius: 4vw; padding: 3vw; }
.device.tablet .screen { aspect-ratio: 1600 / 2560; border-radius: 1.6vw; }
.device.ipad::after, .device.tablet::after { display: none; }

/* elementi hardware, in coordinate logiche (dentro .app, quindi scalati) */
.island { position: absolute; z-index: 30; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 999px; background: #0c0f12; }
.punch { position: absolute; z-index: 30; top: 12px; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; border-radius: 50%; background: #0c0f12; }
.sb { position: absolute; z-index: 29; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; font-family: var(--app-font); font-weight: 600; }
.sb.ios { height: 56px; padding: 6px 30px 0 38px; font-size: 17px; }
.sb.android { height: 32px; padding: 0 22px; font-size: 14px; font-weight: 500; }

.sb svg { display: block; }

.homebar.android { width: 108px; height: 4px; }
.homebar.on-dark { background: #fff; }

.app { position: absolute; left: 0; top: 0; font-family: var(--app-font); overflow: hidden; background: #fff; }

/* ---------- Componenti app (fedeli al Flutter) ---------- */
.mi { font-family: 'Material Icons'; font-weight: normal; font-style: normal; display: inline-block; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
.mio { font-family: 'Material Icons Outlined'; } .mir { font-family: 'Material Icons Round'; }

.fab img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
.fab-l { position: absolute; z-index: 20; top: var(--fab-top); left: 16px; }
.fab-r { position: absolute; z-index: 20; top: var(--fab-top); right: 16px; display: flex; gap: 10px; }

/* Chat */
.chat { position: absolute; inset: 0; display: flex; flex-direction: column; background: #fff; }
.msgs { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 60px 12px 2px; overflow: hidden; }
.datesep { display: flex; align-items: center; padding: 16px; }
.datesep .ln { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #E0E0E0); }
.datesep .ln.r { background: linear-gradient(90deg, #E0E0E0, transparent); }
.datesep .pill { display: inline-flex; align-items: center; gap: 6px; margin: 0 12px; padding: 6px 16px; border-radius: 16px; background: linear-gradient(90deg, #3BA8B0, #145A60); color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .5px; box-shadow: 0 2px 8px rgba(59,168,176,.3); }

.them .bubble { color: rgba(0,0,0,.87); background: linear-gradient(135deg, #EEEEEE, #F5F5F5); border-radius: 20px 20px 20px 4px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

.ibtn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.field { flex: 1; margin: 0 8px 0 4px; display: flex; align-items: center; background: #F5F5F5; border-radius: 24px; padding: 0 4px 0 20px; min-height: 48px; font-size: 16px; color: #9E9E9E; }
.field span:first-child { flex: 1; }
.send { width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.send .c { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(135deg, #E0E0E0, #BDBDBD); transform: scale(.8); }

/* Chiamata */

.call .qp { margin-left: 10px; font-size: 11px; color: rgba(255,255,255,.38); }
.call .sp1 { flex: 1; } .call .sp2 { flex: 2; }
.avatar { width: 160px; height: 160px; border-radius: 50%; border: 4px solid #3BA8B0; box-shadow: 0 0 30px 5px rgba(59,168,176,.2); overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(59,168,176,.3); color: rgba(255,255,255,.7); }
.call .title { margin-top: 32px; font-size: 28px; font-weight: 700; }
.controls { display: flex; justify-content: space-evenly; align-items: flex-end; width: 100%; padding: 0 40px; }
.ctl { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: rgba(255,255,255,.7); }
.ctl .b { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; color: #fff; }
.ctl .b.on { background: rgba(255,255,255,.3); }
.ctl .end { width: 72px; height: 72px; border-radius: 50%; background: #F44336; box-shadow: 0 4px 12px rgba(255,0,0,.4); display: flex; align-items: center; justify-content: center; color: #fff; }

/* Posizione */
.locs { position: absolute; inset: 0; color: #fff; background: var(--grad); display: flex; flex-direction: column; align-items: center; padding-top: calc(var(--safe-t) + 60px); }
.locs .appbar { position: absolute; top: var(--safe-t); left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.locs .appbar .r { display: flex; gap: 24px; }
.ring { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; }
.ring i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); }
.arrow { margin-top: 80px; transform: rotate(-24deg); filter: drop-shadow(0 6px 14px rgba(0,0,0,.18)); }
.panel { margin: 40px 32px 0; padding: 24px 32px; align-self: stretch; text-align: center; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.2); border-radius: 24px; }
.panel .d { font-size: 48px; font-weight: 300; letter-spacing: 2px; }
.panel .t { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 16px; font-size: 13px; font-weight: 300; letter-spacing: .5px; color: rgba(255,255,255,.6); }

/* Calendario / promemoria */
.cal { position: absolute; inset: 0; color: #fff; background: linear-gradient(180deg, #3BA8B0, #145A60); display: flex; flex-direction: column; padding-top: var(--safe-t); }

.cal .wd { display: grid; grid-template-columns: repeat(7, 1fr); padding: 6px 8px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.7); text-align: center; }
.cal .body { position: relative; flex: 1; }
.cal .mh { height: 44px; padding: 12px 16px 4px; font-size: 18px; font-weight: 700; }
.cal .grid { display: grid; grid-template-columns: repeat(7, 1fr); }

.media { position: absolute; inset: 0; background: #FAFAFA; display: flex; flex-direction: column; padding-top: 100px; }

.msep { display: flex; align-items: center; padding: 12px 16px; }
.msep .ln { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #E0E0E0); } .msep .ln.r { background: linear-gradient(90deg, #E0E0E0, transparent); }

.pair .stl { font-size: 14px; color: rgba(255,255,255,.7); margin-top: 8px; }
.card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 12px rgba(0,0,0,.1); color: #2d3436; margin-top: 24px; }
.card .ct { font-size: 18px; font-weight: 700; } .card .cd { font-size: 12px; color: #757575; margin-top: 4px; }
.qrbox { display: inline-block; margin-top: 16px; padding: 12px; border-radius: 16px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
.qrbox img { width: 240px; height: 240px; }

.feature { position: relative; width: 1024px; height: 500px; overflow: hidden; background: var(--paper); display: flex; }
.feature .glow { left: 74%; top: 60%; width: 700px; height: 700px; }

function bubble(side, text, time, tick, reaction) {

  return `<div class="row ${side}"><div class="bubble">${text}<div class="meta"><span>${time}</span>${tk}</div>${rx}</div></div>`;

function locBubble() {

}
function todoBubble(side, text, when, alert, state, time) {
  const done = state === 'done';
  const icon = alert ? 'notifications' : 'calendar_today';
  const al = alert ? `<span class="al">${mi('notifications_active', 12, 'inherit', 'mio')}${alert}</span>` : '';
  let meta;
  if (done) meta = `<span>${time}</span>${mi('check_circle', 12, side === 'me' ? 'rgba(255,255,255,.8)' : '#4CAF50')}`;
  else meta = `<span>${time}</span>` + (side === 'me' ? `<span class="mi tick ${state === 'read' ? 'read' : ''}" style="font-size:14px">${state === 'read' ? 'done_all' : 'done'}</span>` : '');
  return `<div class="row ${side}"><div class="bubble"><span style="${done ? 'text-decoration:line-through' : ''}">${text}</span>
    <div class="todorow">${mi(icon, 14, 'inherit', 'mio')}<span>${when}</span>${al}</div><div class="meta">${meta}</div></div></div>`;
}

];

function appMarkup(sc) {
  return `<div class="app" style="--safe-t:${SAFE_T}px;--safe-b:${SAFE_B}px;--fab-top:${FAB_TOP}px">${sc.html()}${statusBar(sc.dark)}${homebar(sc.dark)}</div>`;
}

function render() {
  const root = document.getElementById('root');
  if (device === 'feature') {
    const f = FEATURE[lang];
    root.innerHTML = `<div class="feature"><img class="bg-cherry" src="img/cherries.png" alt=""><div class="glow"></div>
      <div class="fcopy"><div class="brand"><img src="img/cherries.png" alt=""><span class="word">Tuijo</span></div>
        <h1>${f.h.replace('<em>', '<span class="serif-em">').replace('</em>', '</span>')}</h1><p class="sub">${f.s}</p>
        <div class="trust">${f.t.map(x => `<span>${x}</span>`).join('')}</div></div>
      <div class="fstage"><div class="device iphone"><div class="screen">${hw()}${appMarkup(SCREENS[0])}</div></div></div></div>`;
  } else {
    const c = COPY[lang][shot - 1];
    const sc = SCREENS[shot - 1];
    const frame = device;
    root.innerHTML = `<div class="shot ${sc.theme} dev-${device}"><img class="bg-cherry" src="img/cherries.png" alt=""><div class="glow"></div>
      <div class="copy"><span class="eyebrow">${c.eb}</span><h1>${c.h.replace('<em>', '<span class="serif-em">').replace('</em>', '</span>')}</h1><p class="sub">${c.s}</p></div>
      <div class="stage"><div class="device ${frame}"><div class="screen">${hw()}${appMarkup(sc)}</div></div></div></div>`;
  }
  fit();
}

// L'app è disegnata in px logici (390 su telefono, come Flutter) e scalata con zoom
function fit() {
  document.querySelectorAll('.screen').forEach(screen => {
    const app = screen.querySelector('.app');
    const r = screen.getBoundingClientRect();
    const z = r.width / BASE_W;
    app.style.zoom = z;
    app.style.width = BASE_W + 'px';
    app.style.height = (r.height / z) + 'px';
  });
}
render();
</script>
</body>
</html>
