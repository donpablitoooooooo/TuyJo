<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tuijo — store screenshots</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* =========================================================
   Palette e tipografia: identiche a public/styles.css (sito)
   ========================================================= */
:root {
  --teal: #2F9DA6; --teal-bright: #3BA8B0; --teal-deep: #145A60; --teal-ink: #0C2E32; --teal-night: #08252A;
  --cherry: #D81F2C; --cherry-deep: #9E1B22; --cherry-soft: #F0858E; --leaf: #7CA01E;
  --paper: #F4EDE0; --paper-2: #EFE6D6; --paper-card: #FBF7EF; --cream-line: #E3D7C2;
  --ink: #16302F; --ink-soft: #4A5E5C; --ink-faint: #7E8E8B;
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --sans: "Hanken Grotesk", system-ui, sans-serif;
  --app-font: "Inter", "Roboto", system-ui, sans-serif;
  --grad: linear-gradient(135deg, #3BA8B0, #145A60);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: var(--sans); -webkit-font-smoothing: antialiased; color: var(--ink); }
img { display: block; }

/* ---------- Pagina (uno screenshot) ---------- */
.shot { position: relative; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: var(--paper); }
.shot.dark { background: linear-gradient(160deg, var(--teal-deep) 0%, var(--teal-ink) 55%, var(--teal-night) 100%); color: #fff; }
.bg-cherry { position: absolute; z-index: 0; width: 46vw; right: -16vw; top: -3vh; opacity: .07; transform: rotate(-16deg); pointer-events: none; filter: saturate(.9); }
.shot.dark .bg-cherry { opacity: .07; }
.glow { position: absolute; z-index: 0; left: 50%; top: 66%; width: 130vw; height: 76vh; transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(47,157,166,.34), transparent 72%); }
.shot.dark .glow { background: radial-gradient(closest-side, rgba(59,168,176,.40), transparent 72%); }

.copy { position: relative; z-index: 2; text-align: center; padding: 6.2vh 6.5vw 0; }
.eyebrow { display: inline-flex; align-items: center; gap: .7em; font-weight: 600; font-size: 3vw; letter-spacing: .18em; text-transform: uppercase; color: var(--teal-deep); }
.eyebrow::before, .eyebrow::after { content: ""; width: 1.6em; height: 1.5px; background: var(--cherry); }
.shot.dark .eyebrow { color: var(--teal-bright); }
h1 { font-family: var(--display); font-weight: 800; font-size: 9.4vw; line-height: 1.02; letter-spacing: -.02em; color: var(--teal-ink); margin-top: 1.4vh; text-wrap: balance; }
.shot.dark h1 { color: #fff; }
.serif-em { font-family: var(--serif); font-weight: 400; font-style: italic; letter-spacing: 0; }
.shot.dark .serif-em { color: var(--cherry-soft); }
.sub { font-size: 4.2vw; line-height: 1.35; color: var(--ink-soft); margin: 1.6vh auto 0; max-width: 30ch; text-wrap: balance; }
.shot.dark .sub { color: rgba(255,255,255,.78); }

/* android 9:16: meno alto, quindi testi e telefono un po' più compatti */
.dev-android .copy { padding-top: 5vh; }
.dev-android h1 { font-size: 8.6vw; }
.dev-android .sub { font-size: 3.9vw; margin-top: 1.2vh; }
.dev-android .stage { padding-top: 3vh; }
.dev-android .device.android { width: 74vw; }

/* tablet: testi proporzionalmente più piccoli */
.dev-ipad .eyebrow, .dev-tablet .eyebrow { font-size: 1.9vw; }
.dev-ipad h1, .dev-tablet h1 { font-size: 6.4vw; }
.dev-ipad .sub, .dev-tablet .sub { font-size: 2.6vw; max-width: 36ch; }
.dev-ipad .copy, .dev-tablet .copy { padding-top: 5.5vh; }

.stage { position: relative; z-index: 2; flex: 1; display: flex; justify-content: center; align-items: flex-start; padding-top: 4vh; }

/* ---------- Cornici dispositivo ---------- */
.device { position: relative; background: #0c0f12; box-shadow: 0 40px 90px -30px rgba(12,46,50,.55), 0 0 0 2px rgba(255,255,255,.07) inset; }
.shot.dark .device { box-shadow: 0 40px 90px -30px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.12) inset; }
.device::after { content: ""; position: absolute; right: -0.8vw; top: 22%; width: .8vw; height: 9%; background: #0c0f12; border-radius: 0 3px 3px 0; }
.screen { position: relative; width: 100%; overflow: hidden; background: #fff; }
.device.iphone { width: 80vw; border-radius: 13vw; padding: 3vw; }
.device.iphone .screen { aspect-ratio: 1320 / 2868; border-radius: 10vw; }
.device.android { width: 80vw; border-radius: 9vw; padding: 2.2vw; }
.device.android .screen { aspect-ratio: 1080 / 2340; border-radius: 6.8vw; }
.device.ipad { width: 78vw; border-radius: 4.6vw; padding: 3.4vw; }
.device.ipad .screen { aspect-ratio: 2064 / 2752; border-radius: 1.6vw; }
.device.tablet { width: 78vw; border-radius: 4vw; padding: 3vw; }
.device.tablet .screen { aspect-ratio: 1600 / 2560; border-radius: 1.6vw; }
.device.ipad::after, .device.tablet::after { display: none; }

/* elementi hardware, in coordinate logiche (dentro .app, quindi scalati) */
.island { position: absolute; z-index: 30; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 999px; background: #0c0f12; }
.punch { position: absolute; z-index: 30; top: 12px; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; border-radius: 50%; background: #0c0f12; }
.sb { position: absolute; z-index: 29; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; font-family: var(--app-font); font-weight: 600; }
.sb.ios { height: 56px; padding: 6px 30px 0 38px; font-size: 17px; }
.sb.android { height: 32px; padding: 0 22px; font-size: 14px; font-weight: 500; }
.sb.tab { height: 30px; padding: 0 22px; font-size: 13px; font-weight: 600; }
.sb .ic { display: flex; align-items: center; gap: 6px; }
.sb svg { display: block; }
.sb.on-light { color: #000; } .sb.on-dark { color: #fff; }
.homebar { position: absolute; z-index: 30; bottom: 8px; left: 50%; transform: translateX(-50%); width: 139px; height: 5px; border-radius: 3px; background: #000; }
.homebar.android { width: 108px; height: 4px; }
.homebar.on-dark { background: #fff; }

.app { position: absolute; left: 0; top: 0; font-family: var(--app-font); overflow: hidden; background: #fff; }

/* ---------- Componenti app (fedeli al Flutter) ---------- */
.mi { font-family: 'Material Icons'; font-weight: normal; font-style: normal; display: inline-block; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
.mio { font-family: 'Material Icons Outlined'; } .mir { font-family: 'Material Icons Round'; }
.fab { width: 48px; height: 48px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.10); display: flex; align-items: center; justify-content: center; color: #3BA8B0; }
.fab img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
.fab-l { position: absolute; z-index: 20; top: var(--fab-top); left: 16px; }
.fab-r { position: absolute; z-index: 20; top: var(--fab-top); right: 16px; display: flex; gap: 10px; }

/* Chat */
.chat { position: absolute; inset: 0; display: flex; flex-direction: column; background: #fff; }
.msgs { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 60px 12px 2px; overflow: hidden; }
.datesep { display: flex; align-items: center; padding: 16px; }
.datesep .ln { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #E0E0E0); }
.datesep .ln.r { background: linear-gradient(90deg, #E0E0E0, transparent); }
.datesep .pill { display: inline-flex; align-items: center; gap: 6px; margin: 0 12px; padding: 6px 16px; border-radius: 16px; background: linear-gradient(90deg, #3BA8B0, #145A60); color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .5px; box-shadow: 0 2px 8px rgba(59,168,176,.3); }
.row { display: flex; padding: 0 8px 12px; }
.row.me { justify-content: flex-end; } .row.them { justify-content: flex-start; }
.bubble { position: relative; max-width: 75%; padding: 10px 16px; font-size: 15px; line-height: 1.4; color: #fff; background: var(--grad); border-radius: 20px 20px 4px 20px; box-shadow: 0 2px 8px rgba(59,168,176,.3); }
.them .bubble { color: rgba(0,0,0,.87); background: linear-gradient(135deg, #EEEEEE, #F5F5F5); border-radius: 20px 20px 20px 4px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 4px; font-size: 11px; color: rgba(255,255,255,.8); }
.them .meta { color: rgba(0,0,0,.54); }
.tick { font-size: 14px; color: rgba(255,255,255,.8); } .tick.read { color: #64B5F6; }
.react { position: absolute; bottom: -6px; right: -6px; width: 36px; height: 36px; border-radius: 50%; background: var(--grad); box-shadow: 0 3px 6px rgba(59,168,176,.3); display: flex; align-items: center; justify-content: center; color: #fff; }
.bubble.loc { padding: 0; width: 200px; overflow: hidden; }
.locmap { width: 200px; height: 100px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--grad); color: #fff; }
.locbody { padding: 10px 16px; }
.locbody .st { font-style: italic; }
.locbody .cd { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 12px; color: rgba(255,255,255,.7); }
.locbody .meta { margin-top: 6px; }
.todorow { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.9); }
.them .todorow { color: rgba(0,0,0,.54); }
.todorow .al { display: inline-flex; align-items: center; gap: 2px; margin-left: 8px; }
.typing { display: flex; align-items: center; gap: 8px; padding: 8px 24px; font-size: 13px; font-style: italic; color: #757575; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #BDBDBD; border-top-color: transparent; transform: rotate(35deg); }
.inputbar { display: flex; align-items: center; gap: 0; padding: 12px 8px; padding-bottom: calc(12px + var(--safe-b)); background: #fff; box-shadow: 0 -2px 10px 1px rgba(0,0,0,.05); }
.ibtn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.field { flex: 1; margin: 0 8px 0 4px; display: flex; align-items: center; background: #F5F5F5; border-radius: 24px; padding: 0 4px 0 20px; min-height: 48px; font-size: 16px; color: #9E9E9E; }
.field span:first-child { flex: 1; }
.field.typed { color: rgba(0,0,0,.87); }
.field.typed .caret { display: inline-block; width: 2px; height: 18px; margin-left: 2px; vertical-align: -3px; background: #3BA8B0; }
.send .c.on { background: linear-gradient(135deg, #3BA8B0, #145A60); box-shadow: 0 2px 6px rgba(59,168,176,.4); }
.send { width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.send .c { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(135deg, #E0E0E0, #BDBDBD); transform: scale(.8); }

/* Foto dentro un messaggio (chat_screen.dart: 200×200, raggio 12) */
.bubble.pic { padding: 5px; }
.bubble.pic .img { width: 186px; height: 186px; border-radius: 12px; }
.bubble.pic .meta { margin: 6px 6px 2px; }
/* Chat senza messaggi (chatEmptyMessage) */
.emptychat { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: 15px; line-height: 1.5; color: #9E9E9E; }

/* Chiamata */
.call { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; color: #fff; background: linear-gradient(180deg, #1A1A2E, #16213E, #0F3460); padding-top: calc(var(--safe-t) + 40px); padding-bottom: 60px; }
.call .status { font-size: 16px; letter-spacing: 1.2px; color: rgba(255,255,255,.7); }
.call .qrow { display: flex; align-items: flex-end; gap: 0; margin-top: 10px; }
.call .bar { width: 5px; margin-right: 3px; border-radius: 2px; background: #66BB6A; }
.call .ql { margin-left: 8px; font-size: 12px; letter-spacing: .5px; color: #66BB6A; }
.call .qp { margin-left: 10px; font-size: 11px; color: rgba(255,255,255,.38); }
.call .sp1 { flex: 1; } .call .sp2 { flex: 2; }
.avatar { width: 160px; height: 160px; border-radius: 50%; border: 4px solid #3BA8B0; box-shadow: 0 0 30px 5px rgba(59,168,176,.2); overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(59,168,176,.3); color: rgba(255,255,255,.7); }
.call .title { margin-top: 32px; font-size: 28px; font-weight: 700; }
.controls { display: flex; justify-content: space-evenly; align-items: flex-end; width: 100%; padding: 0 40px; }
.ctl { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: rgba(255,255,255,.7); }
.ctl .b { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; color: #fff; }
.ctl .b.on { background: rgba(255,255,255,.3); }
.ctl .end { width: 72px; height: 72px; border-radius: 50%; background: #F44336; box-shadow: 0 4px 12px rgba(255,0,0,.4); display: flex; align-items: center; justify-content: center; color: #fff; }

/* Posizione */
.locs { position: absolute; inset: 0; color: #fff; background: var(--grad); display: flex; flex-direction: column; align-items: center; padding-top: calc(var(--safe-t) + 60px); }
.locs .appbar { position: absolute; top: var(--safe-t); left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.locs .appbar .r { display: flex; gap: 24px; }
.ring { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; }
.ring i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); }
.arrow { margin-top: 80px; transform: rotate(-24deg); filter: drop-shadow(0 6px 14px rgba(0,0,0,.18)); }
.panel { margin: 40px 32px 0; padding: 24px 32px; align-self: stretch; text-align: center; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.2); border-radius: 24px; }
.panel .d { font-size: 48px; font-weight: 300; letter-spacing: 2px; }
.panel .t { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 16px; font-size: 13px; font-weight: 300; letter-spacing: .5px; color: rgba(255,255,255,.6); }

/* Calendario / promemoria */
.cal { position: absolute; inset: 0; color: #fff; background: linear-gradient(180deg, #3BA8B0, #145A60); display: flex; flex-direction: column; padding-top: var(--safe-t); }
.cal .hdr { display: flex; align-items: center; justify-content: space-between; padding: 4px 12px 0 8px; }
.cal .addp { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 20px; background: rgba(255,255,255,.18); font-size: 15px; font-weight: 600; }
.cal .wd { display: grid; grid-template-columns: repeat(7, 1fr); padding: 6px 8px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.7); text-align: center; }
.cal .body { position: relative; flex: 1; }
.cal .mh { height: 44px; padding: 12px 16px 4px; font-size: 18px; font-weight: 700; }
.cal .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal .grid div { height: 44px; display: flex; align-items: center; justify-content: center; }
.cal .day { position: relative; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.cal .day.today { background: rgba(255,255,255,.3); font-weight: 700; }
.cal .day.sel { background: #fff; color: #145A60; font-weight: 700; }
.cal .day .dot { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: #fff; }
.cal .day.sel .dot { background: #145A60; }
.cal .tpanel { position: absolute; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); height: 42%; border-radius: 20px; background: rgba(255,255,255,.9); box-shadow: 0 4px 12px rgba(0,0,0,.18); padding: 12px; overflow: hidden; }
.cal .tpanel .bubble { max-width: 78%; }

/* Media */
.media { position: absolute; inset: 0; background: #FAFAFA; display: flex; flex-direction: column; padding-top: 100px; padding-bottom: calc(6px + var(--safe-b)); }
.tabs { margin: 0 80px; padding: 6px; border-radius: 30px; background: var(--grad); box-shadow: 0 4px 12px rgba(59,168,176,.3); display: flex; justify-content: space-evenly; }
.tabs .t { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3); }
.tabs .t.on { background: #fff; color: #3BA8B0; border: none; box-shadow: 0 2px 4px rgba(0,0,0,.15); }
.msep { display: flex; align-items: center; padding: 12px 16px; }
.msep .ln { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #E0E0E0); } .msep .ln.r { background: linear-gradient(90deg, #E0E0E0, transparent); }
.msep .pill { display: inline-flex; align-items: center; gap: 6px; margin: 0 12px; padding: 6px 16px; border-radius: 16px; background: var(--grad); color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .5px; box-shadow: 0 2px 8px rgba(59,168,176,.3); }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 8px 8px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #EEE; }
.ph .badge { position: absolute; right: 4px; bottom: 4px; padding: 2px 6px; border-radius: 6px; background: rgba(59,168,176,.9); color: #fff; font-size: 9px; font-weight: 500; }
.ph .badge.p { background: rgba(158,158,158,.9); }
.ph .vid { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(180deg, transparent, rgba(0,0,0,.4)); }

/* Link e documenti (media_screen.dart: _LinkGridItem e _DocumentListItem).
   I link stanno in una masonry a due colonne — nell'app è MasonryGridView.count
   — quindi le schede hanno altezze diverse a seconda della miniatura. */
.lgrid { column-count: 2; column-gap: 8px; padding: 4px 12px 8px; }
.lcard { break-inside: avoid; margin-bottom: 8px; background: #fff; border-radius: 12px;
  border: 1.5px solid rgba(59,168,176,.3); box-shadow: 0 2px 6px rgba(0,0,0,.06); overflow: hidden; }
.lcard.p { border-color: rgba(158,158,158,.35); }
.lcard .thumb { position: relative; overflow: hidden; }
.lcard .noimg { display: flex; align-items: center; justify-content: center; height: 60px; background: rgba(59,168,176,.1); color: #3BA8B0; }
.lcard.p .noimg { background: rgba(158,158,158,.12); color: #9E9E9E; }
.lcard .body { padding: 10px; }
.lcard .tt { font-size: 13px; font-weight: 600; line-height: 1.25; color: #424242; }
.lcard .ds { margin-top: 4px; font-size: 11px; line-height: 1.3; color: #757575; }
.lcard .dm { display: flex; align-items: center; gap: 3px; margin-top: 6px; font-size: 10px; color: #9E9E9E; }
.lcard .dm .site { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlist { display: flex; flex-direction: column; gap: 10px; padding: 4px 12px 8px; }
.drow { display: flex; align-items: center; gap: 12px; padding: 12px; background: #fff; border-radius: 12px; border: 1.5px solid rgba(59,168,176,.3); box-shadow: 0 2px 4px rgba(0,0,0,.04); }
.drow.p { border-color: rgba(158,158,158,.35); }
.drow .ic { width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; background: rgba(59,168,176,.1); border: 1px solid rgba(59,168,176,.3); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #3BA8B0; }
.drow.p .ic { background: rgba(158,158,158,.12); border-color: rgba(158,158,158,.35); color: #9E9E9E; }
.drow .ic b { font-size: 7px; font-weight: 700; letter-spacing: .3px; }
.drow .nm { font-size: 14px; font-weight: 600; color: #424242; }
.drow .meta2 { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 10px; color: #9E9E9E; }
.drow .sz { padding: 1px 5px; border-radius: 4px; background: rgba(59,168,176,.1); color: #3BA8B0; font-weight: 500; }
.drow.p .sz { background: rgba(158,158,158,.12); color: #757575; }
.drow .dt { margin-left: auto; }

/* Il dito che tocca la cornetta */
.tapwrap { position: relative; }
.tapring { position: absolute; top: 50%; left: 50%; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%;
  border: 2px solid rgba(59,168,176,.5); background: radial-gradient(circle, rgba(59,168,176,.25), rgba(59,168,176,.04) 65%, transparent 72%); }
.tapring::after { content: ""; position: absolute; top: 50%; left: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px;
  border-radius: 50%; background: rgba(59,168,176,.22); }

/* Pairing */
.pair { position: absolute; inset: 0; color: #fff; background: linear-gradient(180deg, #3BA8B0, #145A60); padding: 60px 24px 24px; text-align: center; }
.pair .ttl { font-size: 28px; font-weight: 700; margin-top: var(--safe-t); }
.pair .stl { font-size: 14px; color: rgba(255,255,255,.7); margin-top: 8px; }
.card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 12px rgba(0,0,0,.1); color: #2d3436; margin-top: 24px; }
.card .ct { font-size: 18px; font-weight: 700; } .card .cd { font-size: 12px; color: #757575; margin-top: 4px; }

  const batt = `<svg width="28" height="13" viewBox="0 0 28 13"><rect x=".5" y=".5" width="24" height="12" rx="3.5" stroke="currentColor" stroke-opacity=".4" fill="none"/><rect x="2" y="2" width="21" height="9" rx="2" fill="currentColor"/><path d="M26 4.5v4a2 2 0 0 0 0-4Z" fill="currentColor" fill-opacity=".4"/></svg>`;
  const abatt = `<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><rect x="3" y="0" width="4" height="2"/><rect x="0" y="2" width="10" height="14" rx="1.5"/></svg>`;
  const asig = `<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M15 1v15H0Z"/></svg>`;
  const awifi = `<svg width="18" height="16" viewBox="0 0 18 16" fill="currentColor"><path d="M9 15.5 0 4.5a13 13 0 0 1 18 0Z"/></svg>`;
  if (isApple) return `<div class="sb ios ${cls}" style="${isTablet ? 'height:30px;padding:0 22px;font-size:13px' : ''}"><span>9:41</span><span class="ic">${cell}${wifi}${batt}</span></div>`;
  return `<div class="sb android ${cls}"><span>9:41</span><span class="ic">${awifi}${asig}${abatt}</span></div>`;

const hw = () => device === 'iphone' || device === 'feature' || device === 'og' || isWeb ? '<div class="island"></div>' : device === 'android' ? '<div class="punch"></div>' : '';
const homebar = (onDark) => `<div class="homebar ${isApple ? '' : 'android'} ${onDark ? 'on-dark' : ''}"></div>`;

// ---- componenti chat ----
const datesep = (label) => `<div class="datesep"><span class="ln"></span><span class="pill">${mi('flag', 14, '#fff', 'mir')}${label}</span><span class="ln r"></span></div>`;
function bubble(side, text, time, tick, reaction) {
  const tk = side === 'me' && tick ? (tick === 'read' ? `<span class="mi tick read" style="font-size:14px">done_all</span>` : `<span class="mi tick" style="font-size:14px">done</span>`) : '';
  const rx = reaction ? `<span class="react">${mi(reaction, 20, '#fff')}</span>` : '';
  return `<div class="row ${side}"><div class="bubble">${text}<div class="meta"><span>${time}</span>${tk}</div>${rx}</div></div>`;
}
function picBubble(side, time, tick, photo) {
  // photo: sfondo della foto (gradiente disegnato o file vero da img/photos/)
  const tk = side === 'me' && tick ? `<span class="mi tick ${tick === 'read' ? 'read' : ''}" style="font-size:14px">${tick === 'read' ? 'done_all' : 'done'}</span>` : '';
  return `<div class="row ${side}"><div class="bubble pic"><div class="img" style="${photo}"></div>
    <div class="meta"><span>${time}</span>${tk}</div></div></div>`;
}
function locBubble(side) {
  return `<div class="row ${side || 'me'}"><div class="bubble loc"><div class="locmap">${mi('location_on', 48, '#fff')}</div>
    <div class="locbody"><div class="st">${t.locActive}</div><div class="cd">${mi('access_time', 14, 'rgba(255,255,255,.7)')}<span>58m</span></div>
    <div class="meta"><span>21:04</span><span class="mi tick" style="font-size:16px;color:#40C4FF">done_all</span></div></div></div></div>`;
}
function todoBubble(side, text, when, alert, state, time) {
  const done = state === 'done';
  const icon = alert ? 'notifications' : 'calendar_today';
  const al = alert ? `<span class="al">${mi('notifications_active', 12, 'inherit', 'mio')}${alert}</span>` : '';
  let meta;
  if (done) meta = `<span>${time}</span>${mi('check_circle', 12, side === 'me' ? 'rgba(255,255,255,.8)' : '#4CAF50')}`;
  else meta = `<span>${time}</span>` + (side === 'me' ? `<span class="mi tick ${state === 'read' ? 'read' : ''}" style="font-size:14px">${state === 'read' ? 'done_all' : 'done'}</span>` : '');
  return `<div class="row ${side}"><div class="bubble"><span style="${done ? 'text-decoration:line-through' : ''}">${text}</span>
    <div class="todorow">${mi(icon, 14, 'inherit', 'mio')}<span>${when}</span>${al}</div><div class="meta">${meta}</div></div></div>`;
}
function fabs(withCall, tapCall) {
  // tapCall: l'alone del dito che preme la cornetta, per la sequenza del sito
  const call = withCall
    ? `<div class="tapwrap"><div class="fab">${mi('call', 22, '#3BA8B0')}</div>${tapCall ? '<div class="tapring"></div>' : ''}</div>`
    : '';
  return `<div class="fab-l"><div class="fab">${mi('menu', 24, '#3BA8B0')}</div></div>
    <div class="fab-r">${call}<div class="fab"><img src="img/logo_teal.png" alt=""></div></div>`;
}
function inputBar(draft) {
  // draft: il testo che l'altra persona sta scrivendo in questo momento
  const field = draft
    ? `<div class="field typed"><span>${draft}<i class="caret"></i></span><span class="ibtn">${mi('calendar_month', 24, '#757575', 'mio')}</span></div>`
    : `<div class="field"><span>${t.hint}</span><span class="ibtn">${mi('calendar_month', 24, '#757575', 'mio')}</span></div>`;
  return `<div class="inputbar"><div class="ibtn">${mi('add_circle_outline', 28, '#757575')}</div>
    ${field}
    <div class="send"><div class="c ${draft ? 'on' : ''}">${mi('send', 22, '#fff', 'mir')}</div></div></div>`;
}

// ---- schermate ----
function chatScreen(mirror, tapCall) {
  // mirror: la stessa conversazione vista dall'altro telefono. I lati si
  // scambiano, le spunte seguono chi guarda, e chi sta scrivendo vede la
  // propria bozza al posto dell'indicatore "sta scrivendo".
  const sd = (side) => (mirror ? (side === 'me' ? 'them' : 'me') : side);
  // la foto del messaggio: la prima di img/photos/ se c'è, altrimenti disegnata
  const pic = CHAT_PHOTO
    ? `background:url('img/photos/${CHAT_PHOTO}') center/cover`
    : `background:radial-gradient(circle at 62% 30%,#FFE9A8 0 12%,transparent 13%),linear-gradient(180deg,#F6C88B 0%,#E98C6B 46%,#8E4A52 100%)`;
  const earlier = isTablet ? `${datesep(t.yesterday)}
    ${bubble(sd('me'), t.e1, '08:12', 'read')}
    ${bubble(sd('them'), t.e2, '08:15', 'read')}
    ${bubble(sd('me'), t.e3, '13:40', 'read', 'thumb_up')}
    ${bubble(sd('them'), t.e4, '18:02', 'read')}` : '';
  return `<div class="chat">${fabs(true, tapCall)}<div class="msgs">
    ${earlier}
    ${datesep(t.today)}
    ${isTablet ? bubble(sd('them'), t.c1, '21:04', 'read') : ''}
    ${bubble(sd('me'), t.c2, '21:04', 'read')}
    ${locBubble(sd('me'))}
    ${bubble(sd('them'), t.c3, '21:05', 'read', 'favorite')}
    ${todoBubble(sd('me'), t.todo1, `${t.tomorrow} 20:30`, '2h', 'read', '21:06')}
    ${picBubble(sd('them'), '21:08', 'read', pic)}
    ${mirror || !isTablet ? '' : `<div class="typing"><span class="spin"></span><span>${t.typing}</span></div>`}
  </div>${inputBar(mirror ? t.draft : null)}</div>`;
}

// La chat appena abbinata: vuota, poi con il primo messaggio.
function firstChat(view, sent) {
  const mine = view === 'them';   // chi scrive è il secondo telefono
  const body = sent
    ? `<div class="msgs">${datesep(t.today)}${bubble(mine ? 'me' : 'them', t.firstMsg, '21:12', 'read')}</div>`
    : `<div class="emptychat">${t.emptyChat}</div>` +
      (mine ? '' : `<div class="msgs" style="flex:0"><div class="typing"><span class="spin"></span><span>${t.typing}</span></div></div>`);
  const draft = !sent && mine ? t.firstMsg : null;
  return `<div class="chat">${fabs(true)}${body}${inputBar(draft)}</div>`;
}

function callScreen() {
  const bars = [6, 10, 14].map(h => `<span class="bar" style="height:${h}px"></span>`).join('');
  return `<div class="call"><div class="status">03:42</div>
    <div class="qrow">${bars}<span class="ql">${t.good}</span><span class="qp">24 ms · host ↔ host</span></div>
    <div class="sp1"></div>
    <div class="avatar">${mi('person', 80, 'rgba(255,255,255,.7)')}</div>
    <div class="title">${t.callTitle}</div>
    <div class="sp2"></div>
    <div class="controls">
      <div class="ctl"><div class="b">${mi('mic', 28, '#fff')}</div><span>${t.mute}</span></div>
      <div class="ctl"><div class="end">${mi('call_end', 32, '#fff')}</div><span>${t.end}</span></div>
      <div class="ctl"><div class="b on">${mi('volume_up', 28, '#fff')}</div><span>${t.speaker}</span></div>
    </div></div>`;
}
function locationScreen() {
  return `<div class="locs"><div class="appbar">${mi('close', 24, '#fff')}<span class="r">${mi('map', 24, '#fff', 'mio')}${mi('stop_circle', 24, '#fff', 'mio')}</span></div>
    <div class="ring"><i></i></div>
    <div class="arrow">${mi('navigation', 280, '#fff')}</div>
    <div class="panel"><div class="d">350 m</div><div class="t">${mi('location_on', 16, 'rgba(255,255,255,.6)')}<span>${t.ago}</span></div></div></div>`;
}
function calendarScreen() {
  // Settembre 2026: il primo è martedì. Oggi 11 (venerdì), giorno selezionato 12.
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = i - 1 + 1; // offset: lunedì vuoto
    const day = i === 0 ? null : (i <= 30 ? i : null);
    if (!day) { cells.push('<div></div>'); continue; }
    const cls = day === 12 ? 'sel' : day === 11 ? 'today' : '';
    const dot = [3, 12, 19, 26].includes(day) ? '<span class="dot"></span>' : '';
    cells.push(`<div><span class="day ${cls}">${day}${dot}</span></div>`);
  }
  return `<div class="cal"><div class="hdr"><div class="ibtn">${mi('close', 26, '#fff')}</div><span class="addp">${mi('add', 20, '#fff')}${t.add}</span></div>
    <div class="wd">${t.wd.map(w => `<span>${w}</span>`).join('')}</div>
    <div class="body"><div class="mh">${t.month}</div><div class="grid">${cells.join('')}</div>
      <div class="tpanel">
        ${todoBubble('me', t.todo1, `${t.tomorrow} 20:30`, '2h', 'read', '19:12')}
        ${todoBubble('them', t.todo2, `${t.tomorrow} 09:00`, null, 'done', '18:40')}
        ${todoBubble('me', t.todo3, `${t.tomorrow} 17:00`, '1h', 'sent', '19:15')}
      </div></div></div>`;
}
const PHOTOS = [

function mediaScreen(tab) {
  // tab: 0 foto, 1 link, 2 documenti — le tre schede vere di media_screen.dart
  tab = tab || 0;
  const icons = ['photo_library', 'link', 'insert_drive_file'];
  const tabs = `<div class="tabs">${icons.map((ic, i) =>
    `<span class="t ${i === tab ? 'on' : ''}">${mi(ic, 22, i === tab ? '#3BA8B0' : '#fff', i === 1 ? 'mir' : '')}</span>`).join('')}</div>`;
  const sep = (label) => `<div class="msep"><span class="ln"></span><span class="pill">${mi('flag', 14, '#fff', 'mir')}${label}</span><span class="ln r"></span></div>`;

  if (tab === 1) {
    // Anteprime: nell'app sono le thumbnail scaricate dal link. Qui sono
    // disegnate, con altezze diverse — è quello che dà la masonry.
    const THUMB = [
      [120, 'linear-gradient(180deg,#BFE6F2 0 46%,#3BA8B0 46%,#145A60)', 'radial-gradient(circle at 74% 20%,#FFF3C4 0 10%,transparent 11%)'],
      [96,  'linear-gradient(180deg,#CFE6EF 0 52%,#E8D9BC 52%)', 'linear-gradient(135deg,transparent 40%,#B07A4E 40% 47%,transparent 47%),radial-gradient(circle at 24% 74%,#7CA01E 0 13%,transparent 14%)'],
      [74,  'linear-gradient(180deg,#EDF1EA,#DCE4D6)', 'linear-gradient(0deg,transparent 42%,#fff 42% 52%,transparent 52%),linear-gradient(72deg,transparent 44%,#fff 44% 51%,transparent 51%),radial-gradient(circle at 24% 26%,#C9DDB6 0 18%,transparent 19%),radial-gradient(circle at 63% 56%,#D81F2C 0 7%,transparent 8%)'],
      [108, 'linear-gradient(160deg,#F6E7CE,#C9A06B)', 'radial-gradient(circle at 50% 56%,#5B3A22 0 21%,#F2E2C6 22% 26%,transparent 27%)'],
      [88,  'linear-gradient(180deg,#241C35,#0E0A18)', 'radial-gradient(ellipse at 30% 100%,rgba(255,220,130,.5),transparent 55%),radial-gradient(ellipse at 70% 100%,rgba(124,224,215,.45),transparent 55%)'],
    ];
    const card = (i, mine) => {
      const [title, desc, domain, date] = t.links[i];
      const [h, bg, deco] = THUMB[i % THUMB.length];
      // se in img/links/ c'è uno screenshot vero, prende il posto del disegno
      const art = LINKS_REAL[i]
        ? `background:url('img/links/${LINKS_REAL[i]}') center/cover`
        : `background:${deco},${bg}`;
      return `<div class="lcard ${mine ? '' : 'p'}">
        <div class="thumb" style="height:${h}px;${art}"></div>
        <div class="body"><div class="tt">${title}</div><div class="ds">${desc}</div>
        <div class="dm">${mi('public', 10, mine ? '#3BA8B0' : '#9E9E9E')}<span class="site">${domain}</span><span>${date}</span></div></div></div>`;
    };
    return `<div class="media">${fabs(false)}${tabs}
      ${sep(t.month)}<div class="lgrid">${card(0, 1)}${card(1, 0)}${card(2, 1)}</div>
      ${sep(t.month2)}<div class="lgrid">${card(3, 0)}${card(4, 1)}</div></div>`;
  }

  if (tab === 2) {
    const row = (i, mine) => {
      const [name, size, date] = t.docs[i];
      const ext = name.split('.').pop().toUpperCase();
      return `<div class="drow ${mine ? '' : 'p'}"><div class="ic">${mi('description', 18, 'currentColor')}<b>${ext}</b></div>
        <div><div class="nm">${name}</div>
        <div class="meta2"><span class="sz">${size}</span>${mi('lock_outline', 10, 'currentColor', 'mio')}<span>E2E</span><span class="dt">${date}</span></div></div></div>`;
    };
    return `<div class="media">${fabs(false)}${tabs}
      ${sep(t.month)}<div class="dlist">${row(0, 1)}${row(1, 0)}</div>
      ${sep(t.month2)}<div class="dlist">${row(2, 1)}${row(3, 0)}</div></div>`;
  }

  const tile = (i, date, mine, vid) => {
    // se in img/photos/ ci sono foto vere, le usa; altrimenti resta l'astratto
    if (PHOTOS_REAL[i]) {
      return `<div class="ph" style="background-image:url('img/photos/${PHOTOS_REAL[i]}');background-size:cover;background-position:center">${vid ? `<div class="vid">${mi('play_circle_filled', 36, '#fff')}</div>` : ''}<span class="badge ${mine ? '' : 'p'}">${date}</span></div>`;
    }
    const [a, b] = PHOTOS[i % PHOTOS.length].split('|');
    return `<div class="ph" style="background:${b},${a}">${vid ? `<div class="vid">${mi('play_circle_filled', 36, '#fff')}</div>` : ''}<span class="badge ${mine ? '' : 'p'}">${date}</span></div>`;
  };
  // il badge "video" sta solo sulle tessere disegnate: marcarlo su una foto
  // vera la farebbe passare per un video che non è
  const sept = [['10/09', 1], ['10/09', 0], ['08/09', 1], ['06/09', 0], ['05/09', 1], ['02/09', 0]];
  const aug = [['29/08', 1], ['24/08', 0], ['21/08', 1], ['17/08', 0, 1], ['15/08', 1], ['09/08', 0], ['05/08', 1], ['02/08', 0], ['01/08', 1]];
  return `<div class="media">${fabs(false)}${tabs}
    ${sep(t.month)}<div class="pgrid">${sept.map((p, i) => tile(i, p[0], p[1], p[2])).join('')}</div>
    ${sep(t.month2)}<div class="pgrid">${aug.map((p, i) => tile(i + 6, p[0], p[1], p[2])).join('')}</div></div>`;
}

function pairingScreen(done) {
  // done: secondo passo completato, come dopo una lettura riuscita del QR
  const step2 = done
    ? `<div class="donepill">${mi('check_circle', 20, '#3BA8B0')}${t.done}</div>`
    : `<div class="gbtn">${mi('qr_code_scanner', 24, '#fff')}${t.scan}</div>`;
  const snack = done
    ? `<div class="snack">${mi('check_circle_outline', 22, '#fff', 'mio')}<span>${t.okMsg}</span></div>`
    : '';
  return `<div class="pair"><div class="closefab">${mi('close', 22, '#3BA8B0')}</div>
    <div class="ttl">${t.pairTitle}</div><div class="stl">${t.pairSub}</div>
    <div class="card"><div class="ct">${t.s1t}</div><div class="cd">${t.s1d}</div><div class="qrbox"><img src="img/qr-teal.svg" alt=""></div></div>
    <div class="card"><div class="ct">${t.s2t}</div><div class="cd">${t.s2d}</div>${step2}</div>${snack}</div>`;
}

function scannerScreen(state) {
  // La fotocamera inquadra il telefono dell'altra persona: dentro c'è la
  // schermata di pairing vera, la stessa che genera pairingScreen().
  const other = `<div class="other"><div class="minidev"><div class="miniscreen">${appMarkup(SCREENS[5], true)}</div></div></div>`;
  return `<div class="scan ${state}"><div class="cam"></div>
    ${other}
    <div class="vign"></div>
    <div class="fabs"><div class="b">${mi('close', 24, '#3BA8B0')}</div><div class="b">${mi('flash_off', 24, '#3BA8B0')}</div></div>
    <div class="hint">${t.scanHint}</div></div>`;
}

const SCREENS = [
  { html: chatScreen, dark: false, theme: 'paper' },
  { html: callScreen, dark: true, theme: 'dark' },
  { html: locationScreen, dark: true, theme: 'paper' },
  { html: calendarScreen, dark: true, theme: 'paper' },
  { html: mediaScreen, dark: false, theme: 'dark' },
  { html: pairingScreen, dark: true, theme: 'paper' },
  // 7, 8, 9 — solo per il sito: i tre fotogrammi dell'abbinamento
  { html: () => scannerScreen('search'), dark: true, theme: 'paper' },   // inquadra
  { html: () => scannerScreen('lock'), dark: true, theme: 'paper' },     // legge
  { html: () => pairingScreen(true), dark: true, theme: 'paper' },       // completato
  { html: () => chatScreen(true), dark: false, theme: 'paper' },         // 10 — la chat vista dall'altro telefono
  { html: () => mediaScreen(1), dark: false, theme: 'paper' },           // 11 — galleria: i link
  { html: () => mediaScreen(2), dark: false, theme: 'paper' },           // 12 — galleria: i documenti
  { html: () => chatScreen(false, true), dark: false, theme: 'paper' },  // 13 — il dito che preme la cornetta
  { html: () => firstChat('me', false), dark: false, theme: 'paper' },   // 14 — chat vuota, l'altro sta scrivendo
  { html: () => firstChat('them', false), dark: false, theme: 'paper' }, // 15 — chat vuota, la bozza del primo messaggio
  { html: () => firstChat('me', true), dark: false, theme: 'paper' },    // 16 — il primo messaggio, ricevuto
  { html: () => firstChat('them', true), dark: false, theme: 'paper' },  // 17 — il primo messaggio, inviato
];

function appMarkup(sc, bare) {
  // bare: senza barra di stato e home bar (serve ai ritagli a scheda per il sito)
  const chrome = bare ? '' : `${statusBar(sc.dark)}${homebar(sc.dark)}`;
  return `<div class="app" style="--safe-t:${SAFE_T}px;--safe-b:${SAFE_B}px;--fab-top:${FAB_TOP}px">${sc.html()}${chrome}</div>`;
}

function render() {
  const root = document.getElementById('root');
  const webDevice = (sc) => `<div class="device iphone"><div class="screen">${hw()}${appMarkup(sc)}</div></div>`;
  if (isCard) {
    // Una porzione di schermata a tutta larghezza: cambia la forma delle
    // immagini del sito, che altrimenti sarebbero sei telefoni identici.
    const sc = SCREENS[shot - 1];
    root.innerHTML = `<div class="card-stage"><div class="uicard"><div class="screen">${appMarkup(sc, true)}</div></div></div>`;
  } else if (isWeb) {
    // Solo il dispositivo: il testo marketing vive nell'HTML del sito.
    const sc = SCREENS[shot - 1];
    if (device === 'webpair') {
      const sc2 = SCREENS[parseInt(q.get('shot2') || '3', 10) - 1];
      root.innerHTML = `<div class="web-stage pair"><span class="p1">${webDevice(sc)}</span><span class="p2">${webDevice(sc2)}</span></div>`;
    } else {
      root.innerHTML = `<div class="web-stage single">${webDevice(sc)}</div>`;
    }
  } else if (device === 'feature' || device === 'og') {
    const f = device === 'og' ? OG[lang] : FEATURE[lang];
    root.innerHTML = `<div class="feature ${device === 'og' ? 'og' : ''}"><img class="bg-cherry" src="img/cherries.png" alt=""><div class="glow"></div>
      <div class="fcopy"><div class="brand"><img src="img/cherries.png" alt=""><span class="word">Tuijo</span></div>
        <h1>${f.h.replace('<em>', '<span class="serif-em">').replace('</em>', '</span>')}</h1><p class="sub">${f.s}</p>
        <div class="trust">${f.t.map(x => `<span>${x}</span>`).join('')}</div></div>
      <div class="fstage"><div class="device iphone"><div class="screen">${hw()}${appMarkup(SCREENS[0])}</div></div></div></div>`;
  } else {
    const c = COPY[lang][shot - 1];
    const sc = SCREENS[shot - 1];
    const frame = device;
    root.innerHTML = `<div class="shot ${sc.theme} dev-${device}"><img class="bg-cherry" src="img/cherries.png" alt=""><div class="glow"></div>
      <div class="copy"><span class="eyebrow">${c.eb}</span><h1>${c.h.replace('<em>', '<span class="serif-em">').replace('</em>', '</span>')}</h1><p class="sub">${c.s}</p></div>
      <div class="stage"><div class="device ${frame}"><div class="screen">${hw()}${appMarkup(sc)}</div></div></div></div>`;
  }
  fit();
}

// L'app è disegnata in px logici (390 su telefono, come Flutter) e scalata con zoom
function fit() {
  document.querySelectorAll('.screen').forEach(screen => {
    const app = screen.querySelector('.app');
    const r = screen.getBoundingClientRect();
    const z = r.width / BASE_W;
    app.style.zoom = z;
    app.style.width = BASE_W + 'px';
    app.style.height = (r.height / z) + (isCard ? OFFSET : 0) + 'px';
    if (isCard && OFFSET) app.style.top = -OFFSET + 'px';
  });
}
render();
</script>
</body>
</html>
