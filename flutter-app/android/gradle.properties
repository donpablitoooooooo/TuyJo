org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# android.enableJetifier=true # Deprecated - not needed with modern AndroidX

# Built-in Kotlin: NON si puo' attivare finche' i plugin applicano il Kotlin
# Gradle Plugin per conto loro. Al 16/09/2026 sono undici: cryptography_flutter,
# file_picker, firebase_storage, flutter_callkit_incoming,
# flutter_image_compress_common, flutter_webrtc, mobile_scanner,
# package_info_plus, pdfx, share_plus, shared_preferences_android.
# Il build li elenca a ogni esecuzione: quando la lista si svuota, questo flag
# va tolto, perche' Flutter smettera' di compilare i progetti che usano KGP.
android.builtInKotlin=false
# Nuovo DSL di AGP 9: il plugin Gradle di Flutter legge ancora quello vecchio,
# quindi l'opt-out resta finche' non lo migrano loro.
android.newDsl=false
